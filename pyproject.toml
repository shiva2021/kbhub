[project]
name = "kbhub"
version = "0.3.0"
description = "Central local LanceDB index of project knowledge-base folders (decisions, research, handovers), exposed to agents via MCP"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "lancedb>=0.20",
    "pyarrow>=15",
    "pandas>=2",
    "numpy>=1.26",
    "requests>=2.31",
    "wordllama>=0.3",
    "mcp[cli]>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kbhub = "kbhub.cli:main"
kbhub-server = "kbhub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kbhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
